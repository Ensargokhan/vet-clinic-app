name: veteriner_app
description: "Yapay Zeka Destekli Veteriner Klinik Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core & Routing
  go_router: ^12.1.1
  flutter_riverpod: ^2.4.9
  
  # Networking
  dio: ^5.4.0

  # Yerel ayar saklama (tema modu vb.)
  shared_preferences: ^2.2.2
  
  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  intl: ^0.18.1
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
flutter:
  uses-material-design: true
  assets:
    - assets/data/
